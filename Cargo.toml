[package]
name = "aegis"
version = "0.1.0"
edition = "2021"

[features]
test-utils = []

[[bin]]
name = "aegis-runtime"
path = "src/bin/aegis-runtime.rs"

[dependencies]
wasmtime = "24.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.27"
opentelemetry = { version = "0.27", features = ["trace"] }
opentelemetry-otlp = { version = "0.27", features = ["tonic"] }
opentelemetry_sdk = "0.27"
anyhow = "1.0"
thiserror = "1.0"
toml = "0.8"
ring = "0.17"
hex = "0.4"
blake3 = "1.0"
serde_bytes = "0.11"
base64 = "0.22"
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
prost-types = "0.13"
# rustls ring-only (AD-014 D1 "ring matches existing deps"): default-features
# would also compile aws-lc-rs and make it the default provider; `ring` is the
# only crypto provider in the binary. `prefer-post-quantum` is intentionally
# omitted — it is tied to aws_lc_rs in rustls 0.23 (see verify remediation).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# tokio-rustls defaults include aws_lc_rs (feature-unified into rustls) — keep
# it ring-only like tonic's declaration (ring + logging + tls12).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
x509-parser = "0.16"
futures-core = "0.3"
clap = { version = "4", features = ["derive"] }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["net"] }
tower = "0.5"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[build-dependencies]
tonic-build = "0.12"
prost-build = "0.13"

[dev-dependencies]
wat = "1.0"
tempfile = "3"
serde_json = "1.0"
base64 = "0.22"
rcgen = "0.13"
aegis = { path = ".", features = ["test-utils"] }
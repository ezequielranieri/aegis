[package]
name = "aegis"
version = "0.1.0"
edition = "2021"

[features]
test-utils = []

[dependencies]
wasmtime = "24.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.27"
opentelemetry = { version = "0.27", features = ["trace"] }
opentelemetry-otlp = { version = "0.27", features = ["tonic"] }
opentelemetry_sdk = "0.27"
anyhow = "1.0"
thiserror = "1.0"
toml = "0.8"
ring = "0.17"
hex = "0.4"
blake3 = "1.0"
serde_bytes = "0.11"
base64 = "0.22"

[dev-dependencies]
wat = "1.0"
tempfile = "3"
serde_json = "1.0"
base64 = "0.22"
aegis = { path = ".", features = ["test-utils"] }
# Aegis SDD Configuration

project: aegis
mode: hybrid
artifact_store:
  mode: both
delivery_strategy: ask-on-risk

context: |
  Aegis — Secure WASM Runtime with capability-based security, signed execution receipts
  with hash-chaining, declarative policy engine, and OpenTelemetry observability.
  Built on Wasmtime for sandboxing. Rust 2021 edition.

strict_tdd: false

testing:
  projects:
    - path: "."
      stack: "Rust (Wasmtime, Tokio, OpenTelemetry)"
      test_command: "cargo test"
      test_framework: "cargo test / built-in"
      test_layers:
        unit: true
        integration: false
        e2e: false
      coverage:
        available: true
        command: "cargo tarpaulin --out Html"
      quality:
        linter:
          available: true
          command: "cargo clippy -- -D warnings"
        type_checker:
          available: true
          command: "cargo check"
        formatter:
          available: true
          command: "cargo fmt -- --check"

phase_rules:
  proposal:
    template: "sdd/templates/proposal.md"
    required_sections: [intent, scope, approach, risks]
  spec:
    template: "sdd/templates/spec.md"
    required_sections: [requirements, scenarios, acceptance_criteria]
  design:
    template: "sdd/templates/design.md"
    required_sections: [architecture, interfaces, data_models, security]
  tasks:
    template: "sdd/templates/tasks.md"
    required_sections: [tasks, dependencies, estimates]
  apply:
    template: "sdd/templates/apply.md"
    required_sections: [implementation_plan, verification_steps]
  verify:
    template: "sdd/templates/verify.md"
    required_sections: [test_results, coverage_report, compliance_check]
  archive:
    template: "sdd/templates/archive.md"
    required_sections: [delta_specs, lessons_learned, follow_ups]

relevant_skills:
  - rust-wasmtime-sandbox
  - crypto-receipts
  - declarative-policy-engine
  - observability-engineering
  - decision-log
  - work-unit-commits
  - branch-pr